services:
  - type: web
    name: momente
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:standalone
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mcm-memory-tag-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: PGPOOL_MAX
        value: "5"
      - key: APP_BASE_URL
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: OPEN_API
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_CONTENT_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_TASTE_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2

databases:
  - name: mcm-memory-tag-db
    plan: free
    region: singapore
